<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EduHub Mobile — Login</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="eduhub-mobile.css">
</head>
<body>
<div class="canvas">
  <div class="frame-label">Login</div>
  <div class="phone">

    <div class="gtop">
      <div class="statusbar">
        <span>9:41</span>
        <span class="notch"></span>
        <span class="sb-icons">
          <svg viewBox="0 0 24 24" fill="currentColor"><rect x="1" y="14" width="3" height="6" rx="1"/><rect x="7" y="10" width="3" height="10" rx="1"/><rect x="13" y="6" width="3" height="14" rx="1"/><rect x="19" y="2" width="3" height="18" rx="1"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M2 8.5a15 15 0 0 1 20 0"/><path d="M5.5 12a10 10 0 0 1 13 0"/><path d="M9 15.5a5 5 0 0 1 6 0"/><circle cx="12" cy="19" r="1" fill="currentColor" stroke="none"/></svg>
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6"><rect x="2" y="7.5" width="18" height="9" rx="2.5"/><rect x="4" y="9.5" width="12" height="5" rx="1" fill="currentColor" stroke="none"/><path d="M22 10.5v3" stroke-linecap="round"/></svg>
        </span>
      </div>
    </div>

    <div class="body">
      <div class="logo-box"></div>

      <div class="m-field">
        <label>E-mail</label>
        <div class="m-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="m3 7 9 6 9-6"/></svg>
          <input type="email" placeholder="Digite seu e-mail">
        </div>
      </div>

      <div class="m-field">
        <label>Senha</label>
        <div class="m-input">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="11" width="16" height="10" rx="2"/><path d="M8 11V7a4 4 0 0 1 8 0v4"/></svg>
          <input type="password" placeholder="Digite sua senha">
        </div>
      </div>

      <div class="forgot">Esqueci minha senha</div>

      <button class="btn-m">ENTRAR
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4"><path d="M9 6l6 6-6 6"/></svg>
      </button>

      <div style="flex:1"></div>
    </div>

    <div class="footer-brand">
      EduHub
      <div class="home-ind"></div>
    </div>

  </div>
</div>
</body>
</html>
